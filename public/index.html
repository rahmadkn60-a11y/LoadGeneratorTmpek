<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LOADSTRINGVANZ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #fff;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(0, 255, 170, .13),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 20%,
          rgba(130, 70, 255, .15),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(0, 170, 255, .12),
          transparent 35%
        ),
        #050509;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: -1;
      animation:
        floatGlow 8s ease-in-out infinite alternate;
    }

    body::before {
      top: -160px;
      left: -120px;
      background: rgba(0, 255, 170, .12);
    }

    body::after {
      right: -150px;
      bottom: -160px;
      background: rgba(110, 70, 255, .14);
      animation-delay: -4s;
    }

    @keyframes floatGlow {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(30px, 25px, 0) scale(1.15);
      }
    }

    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .055;
      background-image:
        linear-gradient(
          rgba(255,255,255,.2) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.2) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent
        );
    }

    .shell {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #050509;
      background:
        linear-gradient(
          135deg,
          #00ffb3,
          #00d9ff,
          #a66cff
        );
      box-shadow:
        0 0 25px rgba(0,255,180,.25);
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .12em;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 11px;
      color: #777786;
      letter-spacing: .08em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      color: #9999a8;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      box-shadow: 0 0 10px #555;
    }

    .dot.online {
      background: #00ff9d;
      box-shadow:
        0 0 12px #00ff9d;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero h2 {
      margin: 0;
      font-size:
        clamp(30px, 6vw, 64px);
      line-height: .95;
      letter-spacing: -.055em;
      font-weight: 900;
      background:
        linear-gradient(
          90deg,
          #fff,
          #a8ffe3 35%,
          #9db7ff 75%,
          #fff
        );
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation:
        gradientMove 6s linear infinite;
    }

    @keyframes gradientMove {
      to {
        background-position: 250% center;
      }
    }

    .hero p {
      max-width: 680px;
      margin: 15px 0 0;
      color: #81818f;
      line-height: 1.6;
      font-size: 14px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 25px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );
      backdrop-filter: blur(24px);
      box-shadow:
        0 25px 80px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(0,255,190,.7),
          rgba(150,100,255,.7),
          transparent
        );
      opacity: .7;
    }

    .editor {
      padding: 18px;
    }

    .editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 15px;
    }

    .editor-title {
      color: #aaaab8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .counter {
      color: #61616e;
      font-size: 11px;
      font-family: monospace;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 380px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 18px;
      outline: none;
      padding: 20px;
      background:
        rgba(0,0,0,.42);
      color: #e9fff8;
      font:
        13px/1.7
        "SFMono-Regular",
        Consolas,
        monospace;
      tab-size: 2;
      box-shadow:
        inset 0 0 30px rgba(0,0,0,.3);
      transition:
        border-color .2s,
        box-shadow .2s;
    }

    textarea:focus {
      border-color:
        rgba(0,255,180,.35);
      box-shadow:
        0 0 0 3px
          rgba(0,255,180,.045),
        inset 0 0 30px rgba(0,0,0,.3);
    }

    textarea::placeholder {
      color: #444450;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .upload {
      position: relative;
      flex: 1;
      min-height: 50px;
      border-radius: 15px;
      color: #020706;
      font-weight: 900;
      letter-spacing: .04em;
      background:
        linear-gradient(
          100deg,
          #00ffae,
          #00ddff,
          #a875ff,
          #00ffae
        );
      background-size: 300% 100%;
      animation:
        buttonFlow 5s linear infinite;
      box-shadow:
        0 12px 35px
          rgba(0,255,180,.12);
      transition:
        transform .18s,
        filter .18s;
    }

    @keyframes buttonFlow {
      to {
        background-position: 300% 0;
      }
    }

    .upload:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .upload:active {
      transform: translateY(0);
    }

    .upload:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .clear {
      padding: 0 20px;
      min-height: 50px;
      border-radius: 15px;
      color: #9999a6;
      background:
        rgba(255,255,255,.045);
      border: 1px solid
        rgba(255,255,255,.07);
    }

    .clear:hover {
      background:
        rgba(255,255,255,.075);
      color: #fff;
    }

    .result {
      display: none;
      margin-top: 18px;
    }

    .result.show {
      display: block;
      animation:
        reveal .35s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-box {
      padding: 17px;
      border-radius: 18px;
      border: 1px solid
        rgba(0,255,180,.13);
      background:
        rgba(0,255,180,.025);
    }

    .result-label {
      margin-bottom: 8px;
      color: #6e6e7a;
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .result-row {
      display: flex;
      gap: 9px;
      align-items: stretch;
      margin-bottom: 12px;
    }

    .result-row:last-child {
      margin-bottom: 0;
    }

    .result-value {
      min-width: 0;
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
      padding: 13px;
      border-radius: 11px;
      color: #caffed;
      background:
        rgba(0,0,0,.32);
      font: 11px monospace;
    }

    .copy {
      flex: 0 0 auto;
      padding: 0 15px;
      border-radius: 11px;
      color: #b6b6c3;
      background:
        rgba(255,255,255,.055);
      border: 1px solid
        rgba(255,255,255,.07);
    }

    .copy:hover {
      color: #fff;
      background:
        rgba(255,255,255,.09);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform:
        translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 17px;
      border-radius: 12px;
      border: 1px solid
        rgba(255,255,255,.09);
      background:
        rgba(15,15,20,.9);
      backdrop-filter: blur(15px);
      color: #ddd;
      font-size: 12px;
      transition:
        opacity .2s,
        transform .2s;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    .error {
      margin-top: 12px;
      padding: 13px;
      display: none;
      border-radius: 12px;
      border: 1px solid
        rgba(255,70,100,.16);
      background:
        rgba(255,50,80,.045);
      color: #ff9eae;
      font-size: 12px;
      line-height: 1.5;
    }

    .error.show {
      display: block;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #44444f;
      font-size: 10px;
      letter-spacing: .08em;
    }

    @media (max-width: 650px) {
      .shell {
        width:
          min(100% - 18px, 1080px);
        padding-top: 20px;
      }

      .topbar {
        align-items: flex-start;
      }

      .status {
        padding: 7px 9px;
        font-size: 10px;
      }

      .hero h2 {
        font-size: 40px;
      }

      .editor {
        padding: 11px;
      }

      textarea {
        min-height: 330px;
        padding: 15px;
      }

      .actions {
        flex-direction: column;
      }

      .clear {
        min-height: 44px;
      }

      .result-row {
        flex-direction: column;
      }

      .copy {
        min-height: 40px;
      }
    }
  </style>
</head>

<body>
  <div class="grid"></div>

  <main class="shell">

    <header class="topbar">
      <div class="brand">
        <div class="logo">LV</div>

        <div>
          <h1>LOADSTRINGVANZ</h1>
          <p>GITHUB LOAD GENERATOR</p>
        </div>
      </div>

      <div class="status">
        <span
          id="statusDot"
          class="dot"
        ></span>

        <span id="statusText">
          CHECKING
        </span>
      </div>
    </header>

    <section class="hero">
      <h2>
        Upload.<br>
        Generate.<br>
        Execute.
      </h2>

      <p>
        Upload Lua ke repository GitHub,
        generate raw URL, lalu langsung
        salin loadstring yang dihasilkan.
      </p>
    </section>

    <section class="panel">

      <div class="editor">

        <div class="editor-head">
          <div class="editor-title">
            Lua Source
          </div>

          <div
            id="counter"
            class="counter"
          >
            0 chars
          </div>
        </div>

        <textarea
          id="code"
          spellcheck="false"
          autocomplete="off"
          placeholder="Paste kode Lua kamu di sini..."
        ></textarea>

        <div class="actions">

          <button
            id="uploadBtn"
            class="upload"
          >
            UPLOAD TO GITHUB
          </button>

          <button
            id="clearBtn"
            class="clear"
          >
            CLEAR
          </button>

        </div>

        <div
          id="error"
          class="error"
        ></div>

        <div
          id="result"
          class="result"
        >

          <div class="result-box">

            <div class="result-label">
              Raw URL
            </div>

            <div class="result-row">
              <div
                id="rawUrl"
                class="result-value"
              ></div>

              <button
                class="copy"
                data-copy="rawUrl"
              >
                COPY
              </button>
            </div>

            <div class="result-label">
              Loadstring
            </div>

            <div class="result-row">
              <div
                id="loadstring"
                class="result-value"
              ></div>

              <button
                class="copy"
                data-copy="loadstring"
              >
                COPY
              </button>
            </div>

          </div>

        </div>

      </div>

    </section>

    <div class="footer">
      LOADSTRINGVANZ • CLOUDFLARE WORKERS • GITHUB
    </div>

  </main>

  <div
    id="toast"
    class="toast"
  ></div>

  <script>
    const code =
      document.getElementById("code");

    const counter =
      document.getElementById("counter");

    const uploadBtn =
      document.getElementById("uploadBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const result =
      document.getElementById("result");

    const rawUrl =
      document.getElementById("rawUrl");

    const loadstring =
      document.getElementById("loadstring");

    const errorBox =
      document.getElementById("error");

    const toast =
      document.getElementById("toast");

    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");

    function updateCounter() {
      counter.textContent =
        `${code.value.length.toLocaleString()} chars`;
    }

    code.addEventListener(
      "input",
      updateCounter
    );

    code.addEventListener(
      "keydown",
      event => {
        if (event.key === "Tab") {
          event.preventDefault();

          const start =
            code.selectionStart;

          const end =
            code.selectionEnd;

          code.value =
            code.value.substring(
              0,
              start
            ) +
            "  " +
            code.value.substring(
              end
            );

          code.selectionStart =
            code.selectionEnd =
              start + 2;

          updateCounter();
        }
      }
    );

    clearBtn.addEventListener(
      "click",
      () => {
        code.value = "";

        result.classList.remove(
          "show"
        );

        hideError();

        updateCounter();

        code.focus();
      }
    );

    async function checkStatus() {
      try {
        const response =
          await fetch(
            "/api/status",
            {
              cache: "no-store"
            }
          );

        const data =
          await response.json();

        if (
          response.ok &&
          data.success &&
          data.configured
        ) {
          statusDot.classList.add(
            "online"
          );

          statusText.textContent =
            "ONLINE";
        } else {
          statusText.textContent =
            "CONFIG ERROR";
        }

      } catch {
        statusText.textContent =
          "OFFLINE";
      }
    }

    uploadBtn.addEventListener(
      "click",
      async () => {
        hideError();

        if (!code.value.trim()) {
          showError(
            "Kode Lua masih kosong."
          );

          code.focus();

          return;
        }

        uploadBtn.disabled = true;

        uploadBtn.textContent =
          "UPLOADING...";

        result.classList.remove(
          "show"
        );

        try {
          const response =
            await fetch(
              "/api/upload",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    code:
                      code.value
                  })
              }
            );

          const text =
            await response.text();

          let data;

          try {
            data =
              JSON.parse(text);
          } catch {
            throw new Error(
              `Server mengembalikan response tidak valid (HTTP ${response.status}).`
            );
          }

          if (
            !response.ok ||
            !data.success
          ) {
            throw new Error(
              data.error ||
              data.message ||
              `Upload gagal (HTTP ${response.status}).`
            );
          }

          rawUrl.textContent =
            data.rawUrl;

          loadstring.textContent =
            data.loadstring;

          result.classList.add(
            "show"
          );

          showToast(
            "Upload berhasil."
          );

        } catch (error) {
          showError(
            error?.message ||
            "Upload gagal."
          );

        } finally {
          uploadBtn.disabled = false;

          uploadBtn.textContent =
            "UPLOAD TO GITHUB";
        }
      }
    );

    document
      .querySelectorAll(".copy")
      .forEach(button => {
        button.addEventListener(
          "click",
          async () => {
            const target =
              document.getElementById(
                button.dataset.copy
              );

            try {
              await navigator.clipboard.writeText(
                target.textContent
              );

              showToast(
                "Berhasil disalin."
              );

            } catch {
              showToast(
                "Clipboard tidak tersedia."
              );
            }
          }
        );
      });

    function showError(message) {
      errorBox.textContent =
        message;

      errorBox.classList.add(
        "show"
      );
    }

    function hideError() {
      errorBox.classList.remove(
        "show"
      );

      errorBox.textContent = "";
    }

    let toastTimer;

    function showToast(message) {
      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(() => {
          toast.classList.remove(
            "show"
          );
        }, 2200);
    }

    updateCounter();
    checkStatus();
  </script>
</body>
</html>
